<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JD 简历定制台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>JD 简历定制台</h1>
          <p>国央企 / 金融类 / 律所求职</p>
        </div>
        <div class="top-actions">
          <select id="sector">
            <option value="auto">自动识别方向</option>
            <option value="lawfirm">律所 / 法务</option>
            <option value="finance">金融 / 投融资</option>
            <option value="soe">国央企 / 合规</option>
          </select>
          <button id="analyzeBtn" class="primary">生成修改意见</button>
          <button id="webBtn" class="secondary">联网检索并改写</button>
          <button id="downloadBtn" class="secondary">生成中文简历</button>
          <button id="downloadEnBtn" class="secondary">生成英文简历</button>
          <span id="translationStatus" class="gpt-status">AI 改写引擎连接中…</span>
        </div>
      </header>

      <section class="workspace">
        <section class="panel input-panel">
          <div class="panel-head">
            <h2>JD</h2>
            <span id="jdCount">0 字</span>
          </div>
          <textarea id="jdInput" spellcheck="false" placeholder="粘贴岗位 JD"></textarea>

          <div class="requirement-tools">
            <div class="panel-head compact">
              <h2>修改要求</h2>
              <span>可写“突出数据合规/金融/律所”等</span>
            </div>
            <textarea id="customInput" spellcheck="false" placeholder="例如：这个岗位偏数据合规，请增加 AI 出海、技术出口管制、AIGC 模拟立法经历；实习经历按照 STAR 写，删掉无关竞赛地点。"></textarea>
          </div>

          <div class="resume-tools">
            <div class="panel-head compact">
              <h2>原简历</h2>
              <label class="file-label">
                <input id="resumeFile" type="file" accept=".docx,.txt" />
                上传
              </label>
            </div>
            <textarea id="resumeInput" spellcheck="false" placeholder="可粘贴你的简历文本；不填请务必上传你自己的简历文件"></textarea>
          </div>

          <div class="upload-tools">
            <div class="panel-head compact">
              <h2>补充材料</h2>
              <label class="file-label">
                <input id="materialFiles" type="file" multiple accept=".docx,.pdf,.txt,.png,.jpg,.jpeg,.webp,.heic" />
                上传文件/图片
              </label>
            </div>
            <div id="materialList" class="material-list">已连接桌面资料库</div>
          </div>
        </section>

        <section class="panel advice-panel">
          <div class="panel-head">
            <h2>简历修改意见</h2>
            <span id="sectorBadge">等待 JD</span>
          </div>
          <div class="keyword-row" id="keywords"></div>
          <div class="advice-list" id="adviceList"></div>
        </section>

        <section class="panel output-panel">
          <div class="panel-head">
            <h2>修改后简历</h2>
            <div class="download-group">
              <select id="previewLang" class="preview-select">
                <option value="zh">中文预览</option>
                <option value="en">英文预览</option>
              </select>
              <a id="downloadLink" class="download-link" hidden>下载中文</a>
              <a id="downloadEnLink" class="download-link" hidden>下载英文</a>
            </div>
          </div>
          <div class="resume-page" id="resumePreview"></div>
        </section>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>
    <script src="/app.js"></script>
  </body>
</html>
